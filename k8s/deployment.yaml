apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-monitoring-app
  labels:
    app: node-monitoring-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-monitoring-app
  template:
    metadata:
      labels:
        app: node-monitoring-app
    spec:
      containers:
        - name: node-monitoring-app
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 3000
          
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20