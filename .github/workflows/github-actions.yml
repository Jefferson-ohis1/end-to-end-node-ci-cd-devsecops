name: GitHub Actions CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: node-devsecops-phase10-repository
  EKS_CLUSTER_NAME: node-devsecops-phase10-cluster
  IMAGE_NAME: node-monitoring-app

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run tests
        working-directory: app
        run: npm test

      - name: Build Docker image
        run: |
          docker build \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            ./app

      - name: Verify Docker image
        run: |
          docker image inspect "${IMAGE_NAME}:${GITHUB_SHA}" > /dev/null
          echo "Docker image built successfully:"
          docker images "${IMAGE_NAME}"

  aws-deployment:
    name: AWS Deployment
    runs-on: ubuntu-latest
    needs: build-and-test

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Verify ECR repository
        run: |
          aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY}"

      - name: Verify EKS cluster
        run: |
          aws eks describe-cluster \
            --name "${EKS_CLUSTER_NAME}" \
            --region "${AWS_REGION}" \
            --query 'cluster.status' \
            --output text
