name: GitHub Actions CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: node-devsecops-phase10-repository
  EKS_CLUSTER_NAME: node-devsecops-phase10-cluster
  IMAGE_NAME: node-monitoring-app

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run tests
        working-directory: app
        run: npm test

      - name: Build Docker image
        run: |
          docker build \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            ./app

      - name: Verify Docker image
        run: |
          docker image inspect "${IMAGE_NAME}:${GITHUB_SHA}" > /dev/null
          echo "Docker image built successfully:"
          docker images "${IMAGE_NAME}"

  aws-deployment:
    name: AWS Deployment
    runs-on: ubuntu-latest
    needs: build-and-test

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Set AWS account and ECR registry
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          echo "AWS_ACCOUNT_ID=${ACCOUNT_ID}" >> "$GITHUB_ENV"
          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "$GITHUB_ENV"

          echo "AWS account: ${ACCOUNT_ID}"
          echo "ECR registry: ${ECR_REGISTRY}"

      - name: Verify ECR repository
        run: |
          aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY}" \
            --region "${AWS_REGION}"

      - name: Verify EKS cluster
        run: |
          aws eks describe-cluster \
            --name "${EKS_CLUSTER_NAME}" \
            --region "${AWS_REGION}" \
            --query 'cluster.status' \
            --output text

      - name: Build Docker image for deployment
        run: |
          docker build \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            ./app

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image for ECR
        run: |
          docker tag \
            "${IMAGE_NAME}:${GITHUB_SHA}" \
            "${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

      - name: Push Docker image to ECR
        run: |
          docker push \
            "${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      - name: Verify EKS authorization
        run: |
          echo "=== Kubernetes identity ==="
          kubectl auth whoami

          echo "=== Nodes ==="
          kubectl auth can-i list nodes

          echo "=== APIService ==="
          kubectl auth can-i get apiservices

          echo "=== Default namespace deployment ==="
          kubectl auth can-i create deployments -n default

          echo "=== Default namespace service ==="
          kubectl auth can-i create services -n default

          echo "=== Default namespace HPA ==="
          kubectl auth can-i create horizontalpodautoscalers -n default

          echo "=== Attempting node listing ==="
          kubectl get nodes -o wide

      - name: Install Metrics Server v0.8.1
        run: |
          kubectl apply \
            -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.8.1/components.yaml

      - name: Wait for Metrics Server rollout
        run: |
          kubectl rollout status \
            deployment/metrics-server \
            -n kube-system \
            --timeout=180s

      - name: Verify Metrics Server API
        run: |
          echo "=== Metrics APIService ==="
          kubectl get apiservice v1beta1.metrics.k8s.io

          AVAILABLE=$(kubectl get apiservice v1beta1.metrics.k8s.io \
            -o jsonpath='{.status.conditions[?(@.type=="Available")].status}')

          if [ "${AVAILABLE}" != "True" ]; then
            echo "Metrics APIService is not available."
            kubectl describe apiservice v1beta1.metrics.k8s.io
            exit 1
          fi

          echo "=== Metrics API discovery ==="
          kubectl get --raw "/apis/metrics.k8s.io/v1beta1" > /dev/null

          echo "Metrics API is available."

      - name: Verify node CPU and memory metrics
        run: |
          echo "=== Node metrics ==="
          kubectl top nodes

          echo "=== Pod metrics ==="
          kubectl top pods -A

      - name: Verify Kubernetes deployment permissions
        run: |
          echo "=== Kubernetes identity ==="
          kubectl auth whoami

          echo "=== Deployment permission ==="
          kubectl auth can-i create deployments -n default

          echo "=== Service permission ==="
          kubectl auth can-i create services -n default

          echo "=== HPA permission ==="
          kubectl auth can-i create horizontalpodautoscalers -n default

      - name: Render Kubernetes deployment manifest
        run: |
          sed \
            "s|IMAGE_PLACEHOLDER|${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}|g" \
            k8s/deployment.yaml \
            > /tmp/deployment-rendered.yaml

          echo "Rendered image:"
          grep "image:" /tmp/deployment-rendered.yaml

      - name: Deploy application to EKS
        run: |
          kubectl apply -f /tmp/deployment-rendered.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Wait for deployment rollout
        run: |
          kubectl rollout status \
            deployment/node-monitoring-app \
            --timeout=180s

      - name: Verify Kubernetes deployment
        run: |
          echo "=== Deployment ==="
          kubectl get deployment node-monitoring-app

          echo "=== Pods ==="
          kubectl get pods \
            -l app=node-monitoring-app \
            -o wide

          echo "=== Service ==="
          kubectl get service node-monitoring-app

          echo "=== HPA ==="
          kubectl get hpa node-monitoring-app

      - name: Verify application health
        run: |
          for i in {1..30}; do
            SERVICE_HOST=$(kubectl get service node-monitoring-app \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

            if [ -z "${SERVICE_HOST}" ]; then
              SERVICE_HOST=$(kubectl get service node-monitoring-app \
                -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            fi

            if [ -n "${SERVICE_HOST}" ]; then
              echo "LoadBalancer endpoint: ${SERVICE_HOST}"

              if curl \
                --fail \
                --silent \
                --show-error \
                --max-time 10 \
                "http://${SERVICE_HOST}/health"; then

                echo
                echo "Application health check passed."
                exit 0
              fi
            fi

            echo "Waiting for application LoadBalancer and health endpoint..."
            sleep 10
          done

          echo "Application health check failed."
          kubectl get service node-monitoring-app
          kubectl get pods -l app=node-monitoring-app -o wide
          exit 1
